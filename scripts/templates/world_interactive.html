<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Norma · 逐步探索</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111410;color:#e8ebe4;font:14px system-ui}header{padding:16px 24px;display:flex;gap:18px;align-items:center}header a{color:#b9c7ac;text-decoration:none}h1{font-size:18px;margin:0;font-weight:500}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;padding:0 24px 22px}.screen{height:80vh;background:#070907;border:1px solid #30382a;border-radius:10px;position:relative}.screen video,.screen img{width:100%;height:100%;object-fit:contain}[hidden]{display:none!important}aside{display:flex;flex-direction:column;gap:12px}button,select,textarea,input[type=file]{font:inherit;color:inherit;background:#242c20;border:1px solid #45513b;border-radius:6px;padding:9px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea{width:100%;resize:vertical;min-height:85px}.presets,.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}p{margin:0;line-height:1.6;color:#adb6a5;font-size:12px}#status{color:#e1e8d9;font-size:14px;min-height:44px}#error{color:#f4ae9b;white-space:pre-wrap}#download{color:#cedbbe}progress{width:100%;height:10px}#history{max-height:160px;overflow:auto}label{font-size:12px;line-height:1.6}.hint{padding:0 24px 20px}#start{background:#536542}@media(max-width:750px){main{grid-template-columns:1fr}.screen{height:62vh}aside{gap:10px}}</style></head>
<body><header><a href="http://127.0.0.1:8767/">NORMA</a><h1>逐步探索</h1><p>选择动作 → 等待 → 观看 → 继续</p></header>
<main><div class="screen"><img id="preview" alt="选中的输入照片"><video id="video" controls playsinline hidden></video></div>
<aside><div class="presets"><button data-example="mountain">雪山示例</button><button data-example="temple">建筑示例</button></div><input id="file" type="file" accept="image/jpeg,image/png">
<textarea id="prompt" maxlength="1500" aria-label="场景描述">A photorealistic landscape. Preserve solid terrain, stable lighting and coherent scene structure. Camera motion follows the supplied camera controls.</textarea>
<label><input id="consent" type="checkbox">同意将这张照片发送到我的3090服务器，本会话内用于生成。</label><button id="start" disabled>进入场景</button>
<p id="status">选择照片后开始；首次加载模型需要等待。</p><progress id="progress" hidden></progress><p id="error" role="alert"></p>
<div class="actions"><button data-action="forward">前进 W</button><button data-action="backward">后退 S</button><button data-action="left">左移 A</button><button data-action="right">右移 D</button><button data-action="look_left">向左看 ←</button><button data-action="look_right">向右看 →</button><button data-action="look_up">向上看 ↑</button><button data-action="look_down">向下看 ↓</button><button data-action="hold">停留</button><button id="close">结束／取消</button></div>
<a id="download" hidden download>下载当前完整片段</a><div id="history"></div>
<p>首版每会话最多7次操作，累计约10.31秒；10分钟不操作会释放状态。失败或取消后需新建会话，旧片段保留。</p></aside></main>
<p class="hint">这是非实时、有状态的模型生成探索，不是真实三维重建。画面之外的内容由模型补全，可能变形或漂移。方向键只在页面非输入区响应，一次操作完成后才能继续；不自动重试生成。</p>
<script>
const $=s=>document.querySelector(s);let input=null,session=null,busy=false,timer=null,lastArtifact=null;
const phases={queued:'排队中',loading_model:'正在加载模型，请等待',encoding_input:'正在编码场景',generating:'正在生成新的画面',decoding:'正在解码连续片段',saving:'正在保存',ready:'已就绪，可以选择下一步',closed:'会话已结束',failed:'生成失败；请结束后重新开始',worker_restarted:'服务重启，旧会话不可继续',closing:'正在结束并释放状态'};
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Norma-World':'1'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败');return data}
function render(){const active=session&&!['closed','failed','interrupted','empty'].includes(session.status);const ready=active&&session.status==='ready'&&!busy&&session.next_sequence<session.max_steps;
document.querySelectorAll('[data-action]').forEach(b=>b.disabled=!ready);document.querySelectorAll('[data-example]').forEach(b=>b.disabled=active||busy);$('#file').disabled=!!active||busy;$('#prompt').disabled=!!active||busy;$('#consent').disabled=!!active||busy;$('#start').disabled=!!active||busy||!input||!$('#consent').checked;$('#close').disabled=!active||busy;
if(session&&session.status!=='empty'){$('#status').textContent=(phases[session.phase]||session.status)+` · 已完成 ${session.next_sequence||0}/${session.max_steps||7} 步`;if(session.next_sequence>=session.max_steps)$('#status').textContent='本会话已达到长度上限，可下载或结束后重新开始';}
const waiting=active&&['initializing','generating','closing'].includes(session.status);$('#progress').hidden=!waiting;if(waiting&&session.phase==='generating'&&session.total_chunks){$('#progress').max=session.total_chunks;$('#progress').value=session.completed_chunks}else $('#progress').removeAttribute('value');
$('#history').replaceChildren();for(const item of session?.history||[]){const p=document.createElement('p');p.textContent=`第${item.sequence+1}步 · ${item.action} · 累计${item.duration.toFixed(2)}秒 · 本步${item.seconds.toFixed(1)}秒`;$('#history').append(p)}
const item=session?.history?.at(-1);if(item&&item.artifact!==lastArtifact){lastArtifact=item.artifact;const url=`/api/sessions/${session.id}/artifacts/${item.artifact}`;$('#preview').hidden=true;const video=$('#video');video.hidden=false;video.src=url;const previousDuration=session.history.length>1?session.history.at(-2).duration:0;video.onloadedmetadata=()=>{video.currentTime=Math.min(previousDuration,Math.max(0,video.duration-.1));video.play().catch(()=>{})};$('#download').href=url;$('#download').hidden=false;}
}
async function poll(){clearTimeout(timer);if(!session?.id)return;try{session=await api('/api/sessions/'+session.id);render();if(['initializing','generating','closing'].includes(session.status))timer=setTimeout(poll,1800)}catch(e){$('#error').textContent=e.message+'；刷新可尝试恢复，不会自动重发操作。';busy=false;render()}}
async function setImage(blob){if(blob.size>8*1024*1024)throw Error('图片不得超过8MiB');const value=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)});clearTimeout(timer);session=null;input=value.split(',')[1];$('#preview').src=value;$('#preview').hidden=false;$('#video').pause();$('#video').hidden=true;$('#consent').checked=false;$('#download').hidden=true;$('#status').textContent='照片已准备好，请确认发送后进入场景。';lastArtifact=null;render()}
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/examples/'+b.dataset.example);if(!r.ok)throw Error('示例不可用');await setImage(await r.blob())}catch(e){$('#error').textContent=e.message}});
$('#file').onchange=async()=>{try{if($('#file').files[0])await setImage($('#file').files[0])}catch(e){$('#error').textContent=e.message}};$('#consent').onchange=render;$('#prompt').oninput=()=>{$('#consent').checked=false;render()};
$('#start').onclick=async()=>{busy=true;session=null;$('#error').textContent='';lastArtifact=null;$('#video').hidden=true;$('#preview').hidden=false;$('#download').hidden=true;render();try{session=await api('/api/sessions',{image_base64:input,prompt:$('#prompt').value,upload_confirmed:$('#consent').checked});$('#consent').checked=false;poll()}catch(e){$('#error').textContent=e.message}finally{busy=false;render()}};
async function act(action){if(busy||!session||session.status!=='ready'||session.next_sequence>=session.max_steps)return;busy=true;$('#error').textContent='';render();try{session=await api(`/api/sessions/${session.id}/steps`,{sequence:session.next_sequence,action});poll()}catch(e){$('#error').textContent=e.message+'；请刷新核对状态，勿盲目重复提交。'}finally{busy=false;render()}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('#close').onclick=async()=>{busy=true;render();try{session=await api(`/api/sessions/${session.id}/close`,{});poll()}catch(e){$('#error').textContent=e.message}finally{busy=false;render()}};
const keys={w:'forward',s:'backward',a:'left',d:'right',ArrowLeft:'look_left',ArrowRight:'look_right',ArrowUp:'look_up',ArrowDown:'look_down'};document.addEventListener('keydown',e=>{if(e.repeat||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||!keys[e.key])return;e.preventDefault();act(keys[e.key])});
api('/api/current').then(value=>{session=value;render();if(session.id)poll()}).catch(e=>{$('#error').textContent=e.message});render();
</script></body></html>
