[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norma-ai"
version = "0.1.0"
description = "Local AI worker for the Norma personal multimodal photo agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
norma = "ai.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]
selection = [
  "ortools>=9.12,<10",
]

[tool.pytest.ini_options]
testpaths = ["ai/tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["ai", "ai.*"]
exclude = ["ai.tests", "ai.tests.*"]

[tool.setuptools.package-data]
ai = ["web_dist/index.html", "web_dist/assets/*"]
